{{ define "condo_postal_codes/table_row.html" }}
<tr id="condo-postal-code-row-{{ .ID }}">
    <td style="color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px">{{ .ID }}</td>
    <td style="color:var(--ink-2);font-size:13px">
        {{ if .CondoName }}{{ .CondoName }}{{ else }}&mdash;{{ end }}
    </td>
    <td style="color:var(--ink-2);font-size:13px">{{ .PostalCode }}</td>
    <td class="col-act">
        <div class="row-act">
            <button class="ra-btn" title="View"
                hx-get="/condo-postal-codes/{{ .ID }}/view"
                hx-target="body" hx-push-url="true">
                <i class="fa-regular fa-eye" style="font-size:14px"></i>
            </button>
            <button class="ra-btn" title="Edit"
                hx-get="/condo-postal-codes/{{ .ID }}/edit"
                hx-target="body" hx-push-url="true">
                <i class="fa-regular fa-pen-to-square" style="font-size:13px"></i>
            </button>
            <button class="ra-btn danger" title="Delete"
                hx-get="/condo-postal-codes/{{ .ID }}/delete"
                hx-target="#modal-container">
                <i class="fa-regular fa-trash-can" style="font-size:13px"></i>
            </button>
        </div>
    </td>
</tr>
{{ end }}

{{ define "partials/modals/delete_confirm.html" }}
<div style="position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100" onclick="if(event.target===this)closeModal()">
    <div style="background:#fff;border-radius:14px;width:480px;max-width:calc(100vw - 32px);box-shadow:0 30px 60px rgba(11,18,32,.25);overflow:hidden">

        <!-- Header -->
        <div style="padding:18px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border-2)">
            <div>
                <h3 style="margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink)">Delete {{ .Name }}</h3>
                <p style="margin:0;color:var(--ink-3);font-size:13px">This action cannot be undone.</p>
            </div>
            <button onclick="closeModal()" style="background:transparent;border:0;cursor:pointer;color:var(--ink-3);padding:2px;font-size:16px;line-height:1;margin-left:12px">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Body -->
        <div style="padding:16px 20px">
            <p style="font-size:13.5px;color:var(--ink-2);margin:0 0 12px">
                Type <strong>delete</strong> to confirm you want to permanently remove this record:
            </p>
            <input class="form-input" type="text" id="confirm-input"
                placeholder="Type 'delete' here..."
                oninput="checkDeleteInput(this)"
                autocomplete="off" autofocus>
        </div>

        <!-- Error message (shown on delete failure) -->
        <div id="delete-error" style="display:none;padding:0 20px 12px">
            <div class="form-error" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                <span><i class="fa-solid fa-circle-exclamation"></i> <span id="delete-error-msg"></span></span>
                <button type="button" onclick="document.getElementById('delete-error').style.display='none'"
                        style="background:transparent;border:0;cursor:pointer;color:inherit;padding:0;font-size:14px;line-height:1;flex-shrink:0">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border-2);background:#fbfcfe">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn btn-danger"
                    id="confirm-delete-btn"
                    disabled
                    hx-delete="{{ .DeleteURL }}"
                    hx-target="#{{ .RowID }}"
                    hx-swap="outerHTML"
                    hx-on::after-request="if(event.detail.successful){closeModal()}else{document.getElementById('delete-error-msg').textContent=event.detail.xhr.responseText||'An error occurred. Please try again.';document.getElementById('delete-error').style.display='block'}">
                <i class="fa-solid fa-trash" style="font-size:12px"></i>
                Delete
            </button>
        </div>

    </div>
</div>
{{ end }}

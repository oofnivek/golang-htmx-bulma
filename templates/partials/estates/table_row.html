{{ define "estates/table_row.html" }}
<tr id="estate-row-{{ .Estate.ID }}">
    <td style="color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px">{{ .Estate.ID }}</td>
    <td><span style="font-weight:500">{{ .Estate.Name }}</span></td>
    <td class="col-act">
        <div class="row-act">
            <button class="ra-btn" title="View"
                hx-get="/estates/{{ .Estate.ID }}/view"
                hx-target="body" hx-push-url="true">
                <i class="fa-regular fa-eye" style="font-size:14px"></i>
            </button>
            <button class="ra-btn" title="Edit"
                hx-get="/estates/{{ .Estate.ID }}/edit"
                hx-target="body" hx-push-url="true">
                <i class="fa-regular fa-pen-to-square" style="font-size:13px"></i>
            </button>
            <button class="ra-btn danger" title="Delete"
                hx-get="/estates/{{ .Estate.ID }}/delete"
                hx-target="#modal-container">
                <i class="fa-regular fa-trash-can" style="font-size:13px"></i>
            </button>
        </div>
    </td>
</tr>
{{ end }}

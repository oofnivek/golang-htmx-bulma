{{ define "vehicle_statuses/table_row.html" }}
<tr id="status-row-{{ .ID }}">
    <td style="color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px">{{ .ID }}</td>
    <td><span style="font-weight:500">{{ .Substatus }}</span></td>
    <td>
        {{ if .IsActive }}
            <span class="pill pill-on"><span class="dot"></span>Active</span>
        {{ else }}
            <span class="pill pill-off"><span class="dot"></span>Inactive</span>
        {{ end }}
    </td>
    <td class="col-act">
        <div class="row-act">
            <button class="ra-btn" title="View"
                hx-get="/vehicle-statuses/{{ .ID }}/view"
                hx-target="body" hx-push-url="true">
                <i class="fa-regular fa-eye" style="font-size:14px"></i>
            </button>
            <button class="ra-btn" title="Edit"
                hx-get="/vehicle-statuses/{{ .ID }}/edit"
                hx-target="body" hx-push-url="true">
                <i class="fa-regular fa-pen-to-square" style="font-size:13px"></i>
            </button>
            <button class="ra-btn danger" title="Delete"
                hx-get="/vehicle-statuses/{{ .ID }}/delete"
                hx-target="#modal-container">
                <i class="fa-regular fa-trash-can" style="font-size:13px"></i>
            </button>
        </div>
    </td>
</tr>
{{ end }}

{{ define "vehicle_makes/table_row.html" }}
<tr id="make-row-{{ .Make.ID }}">
    <td style="color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px">{{ .Make.ID }}</td>
    <td><span style="font-weight:500">{{ .Make.Name }}</span></td>
    <td>
        {{ if .Make.Status }}
            <span class="pill pill-on"><span class="dot"></span>Active</span>
        {{ else }}
            <span class="pill pill-off"><span class="dot"></span>Inactive</span>
        {{ end }}
    </td>
    <td style="color:var(--ink-2);font-size:13px">
        {{ if .Make.UpdatedBy }}{{ .Make.UpdatedBy }}{{ else }}&mdash;{{ end }}
    </td>
    <td style="color:var(--ink-2);font-size:13px">
        {{ if .Make.UpdatedAt }}{{ in_timezone .Make.UpdatedAt .Timezone }}{{ else }}&mdash;{{ end }}
    </td>
    <td class="col-act">
        <div class="row-act">
            <button class="ra-btn" title="View"
                hx-get="/vehicle-makes/{{ .Make.ID }}/view"
                hx-target="body" hx-push-url="true"
                hx-include="[name='tz']">
                <i class="fa-regular fa-eye" style="font-size:14px"></i>
            </button>
            <button class="ra-btn" title="Edit"
                hx-get="/vehicle-makes/{{ .Make.ID }}/edit"
                hx-target="body" hx-push-url="true">
                <i class="fa-regular fa-pen-to-square" style="font-size:13px"></i>
            </button>
            <button class="ra-btn danger" title="Delete"
                hx-get="/vehicle-makes/{{ .Make.ID }}/delete"
                hx-target="#modal-container">
                <i class="fa-regular fa-trash-can" style="font-size:13px"></i>
            </button>
        </div>
    </td>
</tr>
{{ end }}

{{ define "layout" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar is-primary" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">
                    <strong>Go-HTMX-Bulma</strong>
                </a>
            </div>
            <div class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item" href="/vehicle-colors">
                        Vehicle Colors
                    </a>
                    <a class="navbar-item" href="/vehicle-makes">
                        Vehicle Makes
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            {{ template "content" . }}
        </div>
    </section>

    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <strong>Go-HTMX-Bulma</strong> by <a href="#">You</a>. Built with Go, Gin, HTMX, and Bulma.
            </p>
        </div>
    </footer>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        function closeModal() {
            const modal = document.querySelector('.modal');
            if (modal) {
                modal.classList.remove('is-active');
                setTimeout(() => {
                    document.getElementById('modal-container').innerHTML = '';
                }, 200);
            }
        }

        function checkDeleteInput(input) {
            const btn = document.getElementById('confirm-delete-btn');
            if (input.value.toLowerCase() === 'delete') {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }
        }

        // Close modal on ESC key
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
{{ end }}

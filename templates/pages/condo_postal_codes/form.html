{{ define "breadcrumbs" }}
<span>Condominium Management</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<span hx-get="/condo-postal-codes" hx-target="body" hx-push-url="true" style="cursor:pointer">Condominium Postal Codes</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<b>{{ .title }}</b>
{{ end }}

{{ define "content" }}
<div class="ph">
    <div>
        <h1>{{ .title }}</h1>
        <p>{{ if .condoPostalCode }}Update the condominium postal code.{{ else }}Add a new condominium postal code.{{ end }}</p>
    </div>
</div>

<div class="form-card" style="max-width:480px">
    <form hx-post="{{ .action }}" hx-target="body" hx-push-url="true">
        <div class="form-field">
            <label class="form-label" for="condo_id">Condominium</label>
            <select id="condo_id" class="form-input" name="condo_id" autofocus>
                <option value="0">— Select condominium —</option>
                {{ $currentCondoID := 0 }}
                {{ if .condoPostalCode }}{{ $currentCondoID = .condoPostalCode.CondoID }}{{ end }}
                {{ range .condos }}
                <option value="{{ .ID }}" {{ if eq .ID $currentCondoID }}selected{{ end }}>{{ .Name }}</option>
                {{ end }}
            </select>
        </div>

        <div class="form-field">
            <label class="form-label" for="postal_code">Postal Code</label>
            <input id="postal_code" class="form-input" type="text" name="postal_code"
                value="{{ if .condoPostalCode }}{{ .condoPostalCode.PostalCode }}{{ end }}"
                placeholder="e.g. 123456">
        </div>

        <div class="form-footer">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk" style="font-size:13px"></i>
                Save
            </button>
            <button type="button" class="btn"
                hx-get="/condo-postal-codes" hx-target="body" hx-push-url="true">
                Cancel
            </button>
        </div>
    </form>
</div>
{{ end }}

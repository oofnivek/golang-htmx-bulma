{{ define "content" }}
<div class="box mt-6" style="border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <div class="has-text-centered mb-5 pt-2">
        <span class="icon has-text-primary" style="font-size: 3rem;">
            <i class="fas fa-truck"></i>
        </span>
        <h1 class="title is-3 mt-2 mb-0">Sign In</h1>
        <p class="has-text-grey is-size-6">Fleet Management System</p>
    </div>

    {{ if .error }}
    <div class="notification is-danger is-light" id="login-error">
        <button class="delete" onclick="document.getElementById('login-error').remove()"></button>
        {{ .error }}
    </div>
    {{ end }}

    <form method="POST" action="/login">
        <div class="field">
            <label class="label" for="email">Email Address</label>
            <div class="control has-icons-left">
                <input id="email" class="input" type="email" name="email" placeholder="you@example.com" required autofocus autocomplete="email" value="{{ .email }}">
                <span class="icon is-small is-left">
                    <i class="fas fa-envelope"></i>
                </span>
            </div>
        </div>

        <div class="field">
            <label class="label" for="password">Password</label>
            <div class="control has-icons-left">
                <input id="password" class="input" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                <span class="icon is-small is-left">
                    <i class="fas fa-lock"></i>
                </span>
            </div>
        </div>

        <div class="field mt-5">
            <div class="control">
                <button class="button is-primary is-fullwidth" type="submit">
                    <span class="icon">
                        <i class="fas fa-sign-in-alt"></i>
                    </span>
                    <span>Sign In</span>
                </button>
            </div>
        </div>
    </form>
</div>
{{ end }}

{{ define "content" }}
<div style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">

    <!-- Brand -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1e5ef7,#5b8cff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0">FC</div>
        <div>
            <div style="font-size:16px;font-weight:600;letter-spacing:-.01em">Fleet Console</div>
            <div style="font-size:11px;color:var(--ink-3)">Management Platform</div>
        </div>
    </div>

    <!-- Login card -->
    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:28px 24px;width:100%;box-shadow:var(--shadow-card)">
        <h1 style="font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em">Sign in</h1>
        <p style="font-size:13.5px;color:var(--ink-3);margin:0 0 24px">Enter your credentials to continue.</p>

        {{ if .error }}
        <div class="form-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ .error }}
        </div>
        {{ end }}

        <form method="POST" action="/login">
            <div class="form-field">
                <label class="form-label" for="email">Email Address</label>
                <input id="email" class="form-input" type="email" name="email"
                    placeholder="you@example.com"
                    required autofocus autocomplete="email"
                    value="{{ .email }}">
            </div>
            <div class="form-field">
                <label class="form-label" for="password">Password</label>
                <input id="password" class="form-input" type="password" name="password"
                    placeholder="••••••••"
                    required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
                <i class="fa-solid fa-arrow-right-to-bracket" style="font-size:13px"></i>
                Sign in
            </button>
        </form>
    </div>

</div>
{{ end }}

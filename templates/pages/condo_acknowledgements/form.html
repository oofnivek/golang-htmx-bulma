{{ define "breadcrumbs" }}
<span>Condominium Management</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<span hx-get="/condo-acknowledgements" hx-target="body" hx-push-url="true" style="cursor:pointer">Condominium Acknowledgements</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<b>{{ .title }}</b>
{{ end }}

{{ define "content" }}
<div class="ph">
    <div>
        <h1>{{ .title }}</h1>
        <p>Record a new condominium acknowledgement for a user.</p>
    </div>
</div>

<div class="form-card" style="max-width:480px">
    <form hx-post="{{ .action }}" hx-target="body" hx-push-url="true">
        <div class="form-field">
            <label class="form-label" for="user_id">User ID</label>
            <input id="user_id" class="form-input" type="number" name="user_id"
                placeholder="e.g. 42"
                min="1"
                required
                autofocus>
        </div>

        <div class="form-footer">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk" style="font-size:13px"></i>
                Save
            </button>
            <button type="button" class="btn"
                hx-get="/condo-acknowledgements" hx-target="body" hx-push-url="true">
                Cancel
            </button>
        </div>
    </form>
</div>
{{ end }}

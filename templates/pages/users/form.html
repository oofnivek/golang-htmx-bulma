{{ define "content" }}
<div class="columns is-centered">
    <div class="column is-two-thirds-tablet is-half-desktop">
        <div class="box">
            <h1 class="title mb-5">{{ .title }}</h1>

            <form hx-post="{{ .action }}" hx-target="body" hx-push-url="true">
                <div class="field">
                    <label class="label">Email (Username)</label>
                    <div class="control has-icons-left">
                        <input class="input" type="email" name="email" placeholder="email@example.com" required 
                               value="{{ if .user }}{{ .user.Email }}{{ end }}"
                               {{ if .user }}readonly{{ else }}autofocus{{ end }}>
                        <span class="icon is-small is-left">
                            <i class="fas fa-envelope"></i>
                        </span>
                    </div>
                    {{ if .user }}
                    <p class="help">Email cannot be changed after creation.</p>
                    {{ end }}
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label">First Name</label>
                            <div class="control">
                                <input class="input" type="text" name="first_name" placeholder="John" required 
                                       value="{{ if .user }}{{ .user.FirstName }}{{ end }}"
                                       {{ if .user }}autofocus{{ end }}>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label">Last Name</label>
                            <div class="control">
                                <input class="input" type="text" name="last_name" placeholder="Doe" required 
                                       value="{{ if .user }}{{ .user.LastName }}{{ end }}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label">Mobile</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" name="mobile" placeholder="+1234567890" required 
                                       value="{{ if .user }}{{ .user.Mobile }}{{ end }}">
                                <span class="icon is-small is-left">
                                    <i class="fas fa-phone"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label">Role</label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select name="role_id" required>
                                        <option value="">Select a role</option>
                                        {{ $selectedRole := "" }}
                                        {{ if .user }}{{ $selectedRole = .user.RoleID }}{{ end }}
                                        {{ range .roles }}
                                        <option value="{{ .ID }}" {{ if eq .ID $selectedRole }}selected{{ end }}>{{ .Name }}</option>
                                        {{ end }}
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label">Designation</label>
                            <div class="control">
                                <input class="input" type="text" name="designation" placeholder="Software Engineer" required 
                                       value="{{ if .user }}{{ .user.Designation }}{{ end }}">
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label">Department</label>
                            <div class="control">
                                <input class="input" type="text" name="department" placeholder="Engineering" required 
                                       value="{{ if .user }}{{ .user.Department }}{{ end }}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <div class="control">
                        <label class="checkbox">
                            <input type="checkbox" name="is_enabled" {{ if or (not .user) .user.IsEnabled }}checked{{ end }}>
                            Account Enabled
                        </label>
                    </div>
                </div>

                <div class="field is-grouped is-grouped-right mt-5">
                    <div class="control">
                        <button type="button" class="button is-light" hx-get="/users" hx-target="body" hx-push-url="true">Cancel</button>
                    </div>
                    <div class="control">
                        <button type="submit" class="button is-primary">
                            <span class="icon">
                                <i class="fas fa-save"></i>
                            </span>
                            <span>Save User</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}

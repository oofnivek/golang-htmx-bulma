{{ define "breadcrumbs" }}
<span>Access Management</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<span hx-get="/roles" hx-target="body" hx-push-url="true" style="cursor:pointer">Roles</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<b>{{ .role.Name }}</b>
{{ end }}

{{ define "content" }}
<div class="ph">
    <div>
        <h1>{{ .role.Name }}</h1>
        <p>Role details</p>
    </div>
</div>

<div class="form-card" style="max-width:560px">
    <div class="form-field">
        <label class="form-label">ID</label>
        <div class="form-readonly">{{ .role.ID }}</div>
    </div>

    <div class="form-field">
        <label class="form-label">Name</label>
        <div class="form-readonly">{{ .role.Name }}</div>
    </div>

    <div class="form-footer">
        <button type="button" class="btn"
            hx-get="/roles" hx-target="body" hx-push-url="true">
            <i class="fa-solid fa-arrow-left" style="font-size:12px"></i>
            Back to List
        </button>
    </div>
</div>
{{ end }}

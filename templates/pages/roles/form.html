{{ define "content" }}
<div class="columns is-centered">
    <div class="column is-half">
        <div class="box">
            <h1 class="title mb-5">{{ .title }}</h1>
            <form hx-post="{{ .action }}" hx-target="body" hx-push-url="true">
                <div class="field">
                    <label class="label">ID</label>
                    <div class="control">
                        <input class="input" type="text" name="id" placeholder="Role ID (e.g. ADMIN)" value="{{ if .role }}{{ .role.ID }}{{ end }}" {{ if .role }}readonly{{ else }}required autofocus{{ end }}>
                    </div>
                    {{ if not .role }}
                    <p class="help">Max 10 characters.</p>
                    {{ end }}
                </div>

                <div class="field">
                    <label class="label">Name</label>
                    <div class="control">
                        <input class="input" type="text" name="name" placeholder="Role Name" value="{{ if .role }}{{ .role.Name }}{{ end }}" required {{ if .role }}autofocus{{ end }}>
                    </div>
                </div>

                <div class="field is-grouped is-grouped-right mt-5">
                    <div class="control">
                        <button type="submit" class="button is-link">
                            <span class="icon">
                                <i class="fas fa-save"></i>
                            </span>
                            <span>Save</span>
                        </button>
                    </div>
                    <div class="control">
                        <button type="button" class="button is-link is-light" hx-get="/roles" hx-target="body" hx-push-url="true">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}

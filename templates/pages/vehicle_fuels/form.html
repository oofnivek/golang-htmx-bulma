{{ define "breadcrumbs" }}
<span>Vehicle Management</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<span hx-get="/vehicle-fuels" hx-target="body" hx-push-url="true" style="cursor:pointer">Vehicle Fuels</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<b>{{ .title }}</b>
{{ end }}

{{ define "content" }}
<div class="ph">
    <div>
        <h1>{{ .title }}</h1>
        <p>{{ if .fuel }}Update the fuel configuration and active status.{{ else }}Add a new fuel configuration to the fleet.{{ end }}</p>
    </div>
</div>

<div class="form-card" style="max-width:560px">
    <form hx-post="{{ .action }}" hx-target="body" hx-push-url="true">
        <div class="form-field">
            <label class="form-label" for="vehicle_make_id">Vehicle Make</label>
            <select id="vehicle_make_id" class="form-input" name="vehicle_make_id" required autofocus>
                <option value="">-- Select Vehicle Make --</option>
                {{ range .vehicleMakes }}
                    <option value="{{ .ID }}" {{ if eq .ID $.currentMakeID }}selected{{ end }}>{{ .Name }}</option>
                {{ end }}
            </select>
        </div>

        <div class="form-field">
            <label class="form-label" for="vehicle_model_id">Vehicle Model</label>
            <select id="vehicle_model_id" class="form-input" name="vehicle_model_id" required>
                <option value="">-- Select Vehicle Model --</option>
                {{ range .vehicleModels }}
                    <option value="{{ .ID }}" {{ if eq .ID $.currentModelID }}selected{{ end }}>{{ .Name }}</option>
                {{ end }}
            </select>
        </div>

        <div class="form-field">
            <label class="form-label" for="fuel_type_id">Fuel Type</label>
            <select id="fuel_type_id" class="form-input" name="fuel_type_id" required>
                <option value="">-- Select Fuel Type --</option>
                {{ range .fuelTypes }}
                    <option value="{{ .ID }}" {{ if eq .ID $.currentFuelTypeID }}selected{{ end }}>{{ .Name }}</option>
                {{ end }}
            </select>
        </div>

        <div class="form-field">
            <label class="form-label" for="fuel_tank_size">Fuel Tank Size (L)</label>
            <input id="fuel_tank_size" class="form-input" type="number" step="0.01" min="0" name="fuel_tank_size"
                placeholder="e.g. 60.00"
                value="{{ if .fuel }}{{ .fuel.FuelTankSize }}{{ end }}"
                required>
        </div>

        <div class="form-field">
            <label class="form-label" for="fuel_consumption">Fuel Consumption (L/100km)</label>
            <input id="fuel_consumption" class="form-input" type="number" step="0.01" min="0" name="fuel_consumption"
                placeholder="e.g. 8.50"
                value="{{ if .fuel }}{{ .fuel.FuelConsumption }}{{ end }}"
                required>
        </div>

        <div class="form-field">
            <label class="form-check">
                <input type="checkbox" name="status" {{ if or (not .fuel) .fuel.Status }}checked{{ end }}>
                <span>Active</span>
            </label>
        </div>

        <div class="form-footer">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk" style="font-size:13px"></i>
                Save
            </button>
            <button type="button" class="btn"
                hx-get="/vehicle-fuels" hx-target="body" hx-push-url="true">
                Cancel
            </button>
        </div>
    </form>
</div>
{{ end }}

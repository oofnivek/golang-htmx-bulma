{{ define "breadcrumbs" }}
<span>Vehicle Management</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<span hx-get="/vehicle-statuses" hx-target="body" hx-push-url="true" style="cursor:pointer">Vehicle Statuses</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<b>{{ .title }}</b>
{{ end }}

{{ define "content" }}
<div class="ph">
    <div>
        <h1>{{ .title }}</h1>
        <p>Vehicle status details</p>
    </div>
</div>

<div class="form-card" style="max-width:560px">
    <div class="form-field">
        <label class="form-label">ID</label>
        <div class="form-readonly">{{ .status.ID }}</div>
    </div>

    <div class="form-field">
        <label class="form-label">Substatus</label>
        <div class="form-readonly">{{ .status.Substatus }}</div>
    </div>

    <div class="form-field">
        <label class="form-label">Active</label>
        <div style="padding-top:4px">
            {{ if .status.IsActive }}
                <span class="pill pill-on"><span class="dot"></span>Active</span>
            {{ else }}
                <span class="pill pill-off"><span class="dot"></span>Inactive</span>
            {{ end }}
        </div>
    </div>

    <div class="form-footer">
        <button type="button" class="btn"
            hx-get="/vehicle-statuses" hx-target="body" hx-push-url="true">
            <i class="fa-solid fa-arrow-left" style="font-size:12px"></i>
            Back to List
        </button>
    </div>
</div>
{{ end }}

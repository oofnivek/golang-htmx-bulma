{{ define "breadcrumbs" }}
<span>Vehicle Management</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<span hx-get="/vehicle-statuses" hx-target="body" hx-push-url="true" style="cursor:pointer">Vehicle Statuses</span>
<i class="fa-solid fa-chevron-right" style="font-size:10px;opacity:.5"></i>
<b>{{ .title }}</b>
{{ end }}

{{ define "content" }}
<div class="ph">
    <div>
        <h1>{{ .title }}</h1>
        <p>{{ if .status }}Update the substatus and active state.{{ else }}Add a new status option to the fleet.{{ end }}</p>
    </div>
</div>

<div class="form-card" style="max-width:560px">
    <form hx-post="{{ .action }}" hx-target="body" hx-push-url="true">
        <div class="form-field">
            <label class="form-label" for="substatus">Substatus</label>
            <input id="substatus" class="form-input" type="text" name="substatus"
                placeholder="e.g. In Service"
                value="{{ if .status }}{{ .status.Substatus }}{{ end }}"
                required autofocus>
        </div>

        <div class="form-field">
            <label class="form-check">
                <input type="checkbox" name="is_active" {{ if or (not .status) .status.IsActive }}checked{{ end }}>
                <span>Active</span>
            </label>
        </div>

        <div class="form-footer">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk" style="font-size:13px"></i>
                Save
            </button>
            <button type="button" class="btn"
                hx-get="/vehicle-statuses" hx-target="body" hx-push-url="true">
                Cancel
            </button>
        </div>
    </form>
</div>
{{ end }}
